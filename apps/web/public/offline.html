<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Amdox ERP</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; }
    .card { text-align: center; padding: 48px 32px; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 400px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    button { background: #2563eb; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection. Critical read views (dashboard, finance, HR) are available from cache. Mutations will sync automatically when you reconnect.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
